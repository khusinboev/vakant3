[pytest]
asyncio_mode = auto
# Repo root on sys.path so bare `pytest` imports `config`, `src`, `webapp` (tests/ has no __init__.py).
pythonpath = .
addopts = -m "not network"
markers =
    network: tashqi API ga real so'rov yuboradigan testlar (odatda o'tkazib yuboriladi)
# pytest-timeout: a hung test (e.g. an async loop waiting forever) fails after
# 60 s with a stack dump instead of hanging the CI job until its 15 min limit.
# The default `signal` method fails just that test and the session goes on.
timeout = 60
# Built-in faulthandler: dump all stacks of a test still running after 45 s,
# so the log shows where it was stuck before the hard timeout kills the run.
faulthandler_timeout = 45
