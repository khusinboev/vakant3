# CI + release for vakant3 (see .claude/deploy.md).
#
#   backend   pyflakes + full pytest (network tests deselected by pytest.ini)
#   frontend  npm ci, eslint, `npm run build` (tsc -b + vite) -> dist artifact
#   ci-ok     the single aggregate status
#   release   master pushes only, after ci-ok: force-pushes ONE commit to the `deploy` branch = this tree + built dist +
#             RELEASE (the source sha). The server's ops/auto_deploy.sh (cron) pulls `deploy` and ships it, so only
#             CI-tested commits reach production and nothing is built on the shared server.
#
# Secrets: none besides the automatic GITHUB_TOKEN. Tests use a temp DB and a dummy TOKEN (tests/conftest.py).
# Third-party actions are pinned to full commit SHAs (version in the trailing comment).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend (pyflakes + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # Resume PDFs render with DejaVu from /usr/share/fonts/truetype/dejavu/ (webapp/resume/render/base.py), as on the server.
      - name: Fonts
        run: sudo apt-get install -y -qq fonts-dejavu-core >/dev/null
      - run: pip install -q -r requirements.txt pyflakes
      - run: python -m pyflakes main.py config.py src webapp/main.py webapp/core webapp/routers webapp/models webapp/resume tests
      - run: pytest -q

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: webapp/frontend/dist
          retention-days: 7
          if-no-files-found: error

  ci-ok:
    name: ci-ok
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        run: |
          [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.frontend.result }}" = "success" ]

  release:
    name: release (deploy branch)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [ci-ok]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: webapp/frontend/dist
      - name: Push the release commit to `deploy`
        run: |
          # A newer master push will release itself; never move `deploy` back to an older commit.
          tip=$(git ls-remote origin refs/heads/master | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::$GITHUB_SHA is no longer the master tip ($tip); skipping release"
            exit 0
          fi
          test -f webapp/frontend/dist/index.html
          echo "$GITHUB_SHA" > RELEASE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan release-tmp
          git add -f RELEASE webapp/frontend/dist
          git commit -q -m "release $GITHUB_SHA"
          git push -q -f origin HEAD:refs/heads/deploy
          {
            echo "### Released \`$GITHUB_SHA\` to \`deploy\`"
            echo "The server picks it up within ~2 minutes (ops/auto_deploy.sh). Disable: touch /home/vakant/.deploy/auto-deploy.disabled"
          } >> "$GITHUB_STEP_SUMMARY"
